<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Select Your Region</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#030303}
body{display:flex;justify-content:center;align-items:flex-start;font-family:Arial,"Noto Sans SC",sans-serif;overflow-x:hidden}
.poster{position:relative;width:min(100vw,66.6667vh);aspect-ratio:2/3;max-width:100vw;overflow:hidden;background:#050505;isolation:isolate}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;z-index:0;pointer-events:none}
.video-window{position:absolute;z-index:2;left:9.2%;top:15.55%;width:63.8%;height:26.9%;border:0;border-radius:2.1%;overflow:hidden;background:#080808;box-shadow:0 0 12px #ffc34e88}
.video-window video{width:100%;height:100%;display:block;object-fit:cover;background:#080808}
.close-video{position:absolute;z-index:5;left:69.7%;top:12.0%;width:7.3%;aspect-ratio:1;border:2px solid #f3c45c;border-radius:50%;background:radial-gradient(circle at 35% 25%,#644313,#080706 75%);color:#ffe5a1;font-size:clamp(15px,4vw,27px);font-weight:700;line-height:1;box-shadow:0 0 10px #f4bd48aa;cursor:pointer;display:grid;place-items:center;padding:0}
.close-video:active{transform:scale(.94)}
.region-link{position:absolute;z-index:4;top:67.8%;height:4.65%;width:35.1%;display:flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid #fff0a6;border-radius:999px;color:#281804;font-weight:900;font-style:italic;letter-spacing:.04em;font-size:clamp(12px,3.5vw,24px);background:linear-gradient(180deg,#fff2ad 0%,#ffd15e 45%,#d88c20 100%);box-shadow:0 2px 0 #87500d,0 0 12px #ffcf5c99,inset 0 1px 2px #fff9d9;white-space:nowrap}
.region-link:active{transform:translateY(2px);filter:brightness(.95)}
.region-link.malaysia{left:11.35%}
.region-link.singapore{left:56.7%}
@media(min-width:700px){.poster{width:min(100vw,66.6667vh)}}
@media(max-height:560px) and (orientation:landscape){body{align-items:center}.poster{width:auto;height:100dvh;max-width:100vw}}
</style>
</head>
<body>
<main class="poster" aria-label="Select your region">
  <img class="art" src="region-design.png" alt="黑金地区选择页面，包含马来西亚和新加坡国旗及城市夜景">
  <div class="video-window" id="videoWindow">
    <video id="themeVideo" src="TPower-theme.mp4" controls autoplay muted playsinline preload="auto" poster="region-design.png"></video>
  </div>
  <button class="close-video" id="closeVideo" type="button" aria-label="关闭视频">×</button>
  <a class="region-link malaysia" href="https://tinyurl.com/tpowernew" aria-label="Malaysia">MALAYSIA&nbsp; ›</a>
  <a class="region-link singapore" href="https://tinyurl.com/tpowersg" aria-label="Singapore">SINGAPORE&nbsp; ›</a>
</main>
<script>
const video=document.getElementById('themeVideo');
const close=document.getElementById('closeVideo');
const frame=document.getElementById('videoWindow');
// Mobile browsers generally require muted autoplay; viewers can enable sound in the native controls.
video.muted=true;
const attempt=video.play();
if(attempt && typeof attempt.catch==='function') attempt.catch(()=>{});
close.addEventListener('click',()=>{video.pause();frame.style.display='none';close.style.display='none';});
</script>
</body>
</html>
