<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>TPOWER · Select Your Region</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}
body{display:grid;place-items:center;font-family:Arial,"Noto Sans SC",sans-serif}
.poster{position:relative;width:min(100vw,75.17dvh);aspect-ratio:1087/1446;max-height:100dvh;max-width:100vw;overflow:hidden;background:#05070d}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
/* Clean background with live page headings, cards and player. */

.header{position:absolute;z-index:5;left:4%;top:11%;width:92%;display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none}
.header h1{margin:0;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;
 font-size:clamp(25px,6.2vw,48px);line-height:1.12;letter-spacing:.015em;color:#ffe6a0;
 text-shadow:0 2px 0 #8b5a16,0 0 12px #e7b94f99,0 3px 6px #000}
.header p{margin:3.2% 0 0;font-family:'Noto Sans SC',Arial,sans-serif;font-size:clamp(15px,3.5vw,25px);
 letter-spacing:.12em;color:#fff3d5;text-shadow:0 2px 5px #000,0 0 10px #000}

.region-area{position:absolute;z-index:6;left:2%;top:45.8%;width:96%;height:36.5%;display:grid;grid-template-columns:1fr 1fr;gap:2.5%;align-items:stretch}
.region-card{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;padding:7% 4%;border:1.5px solid #d9ad51;border-radius:18px;background:linear-gradient(155deg,rgba(26,22,17,.99),rgba(3,6,13,.99) 58%,rgba(24,17,8,.99));box-shadow:0 0 12px #e6b64f66,inset 0 0 18px #c18a2d33;text-decoration:none;color:#fff}
.flag{display:block;width:84%;max-width:244px;aspect-ratio:1.94/1;height:auto;object-fit:cover;border:0;border-radius:0;box-shadow:none;filter:none}
.country{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:clamp(15px,4.1vw,31px);letter-spacing:.03em;color:#ffe5a0;text-shadow:0 2px 4px #000;text-align:center}
.country-cn{font-size:clamp(11px,2.7vw,19px);color:#e9d8b2;letter-spacing:.12em}
.login{width:100%;max-width:220px;text-align:center;padding:8% 3%;border-radius:999px;color:#261705;font-size:clamp(13px,3.3vw,23px);font-weight:900;font-style:italic;letter-spacing:.08em;background:linear-gradient(180deg,#fff0a6 0%,#f6c54f 45%,#bd7918 100%);box-shadow:0 3px 0 #71430b,0 0 12px #ffcf5b66}
.region-card:active .login{transform:translateY(2px);box-shadow:0 1px 0 #71430b}
.player{position:absolute;z-index:8;left:6%;top:85.8%;width:88%;height:10.5%;padding:0 6%;display:flex;align-items:center;justify-content:space-between;gap:5%;border:1.5px solid #dfb454;border-radius:999px;background:linear-gradient(180deg,#282013 0%,#08090d 52%,#1c1408 100%);box-shadow:0 0 14px #e4b44b77,inset 0 0 12px #c58c2d44}
.music-symbol{font-family:Georgia,serif;font-size:clamp(22px,6vw,42px);color:#ffdf8b;text-shadow:0 0 10px #ffbd43;flex:0 0 auto}
.play{width:17%;height:68%;max-width:58px;flex:0 0 auto;border:2px solid #f1cb70;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#75521a,#090807 72%);color:#ffe8ad;font-size:clamp(16px,4vw,27px);font-weight:bold;box-shadow:0 0 10px #e9b94e88;cursor:pointer}
.play:active{transform:scale(.94)}
.volume-wrap{display:flex;align-items:center;gap:8%;flex:1;min-width:0}
.volume-icon{font-size:clamp(17px,4vw,27px);color:#ffe2a0;flex:0 0 auto}
.volume{width:100%;min-width:0;height:28px;margin:0;appearance:none;-webkit-appearance:none;background:transparent;touch-action:pan-x;cursor:pointer}
.volume::-webkit-slider-runnable-track{height:4px;border-radius:8px;background:linear-gradient(90deg,#ffe18a,#d99722)}
.volume::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff4bf,#ffc43d 62%,#b87512);border:1px solid #fff0ad;box-shadow:0 0 8px #ffc43d}
.volume::-moz-range-track{height:4px;border-radius:8px;background:linear-gradient(90deg,#ffe18a,#d99722)}
.volume::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#ffc43d;border:1px solid #fff0ad}
@media(max-height:520px){.poster{width:auto;height:100dvh;max-width:100vw}}
</style>
</head>
<body>
<main class="poster" aria-label="TPOWER region selection">
<img class="art" src="region-background.png" alt="Kuala Lumpur and Singapore night skyline">
<header class="header"><h1>SELECT YOUR REGION</h1><p>请选择你的登录地区</p></header>
<section class="region-area" aria-label="选择登录地区">
 <a class="region-card" href="https://tinyurl.com/tpowernew" aria-label="Malaysia Login">
  <img class="flag" src="malaysia-flag.png" alt="Malaysia flag">
  <span class="country">MALAYSIA</span>
  <span class="country-cn">马来西亚</span>
  <span class="login">LOGIN&nbsp; ››</span>
 </a>
 <a class="region-card" href="https://tinyurl.com/tpowersg" aria-label="Singapore Login">
  <img class="flag" src="singapore-flag.png" alt="Singapore flag">
  <span class="country">SINGAPORE</span>
  <span class="country-cn">新加坡</span>
  <span class="login">LOGIN&nbsp; ››</span>
 </a>
</section>
<div class="player" aria-label="音乐控制器">
 <span class="music-symbol" aria-hidden="true">♫</span>
 <button class="play" id="play" type="button" aria-label="播放音乐">▶</button>
 <div class="volume-wrap">
  <span class="volume-icon" aria-hidden="true">🔊</span>
  <input class="volume" id="volume" type="range" min="0" max="1" step="0.01" value="0.75" aria-label="调整音乐音量">
 </div>
</div>
<audio id="audio" src="TPOWER.mp3" preload="auto" loop playsinline></audio>
</main>
<script>
const audio=document.getElementById('audio');
const play=document.getElementById('play');
const volume=document.getElementById('volume');
audio.volume=Number(volume.value);
function sync(){const playing=!audio.paused;play.textContent=playing?'Ⅱ':'▶';play.setAttribute('aria-label',playing?'暂停音乐':'播放音乐')}
play.addEventListener('click',async()=>{if(audio.paused){try{await audio.play()}catch(e){}}else{audio.pause()}sync()});
volume.addEventListener('input',()=>{audio.volume=Number(volume.value)});
audio.addEventListener('play',sync);audio.addEventListener('playing',sync);audio.addEventListener('pause',sync);
</script>
</body>
</html>
