<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>TPOWER · Select Your Region</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}
body{display:grid;place-items:center}
.poster{position:relative;width:min(100vw,75.17dvh);aspect-ratio:1087/1446;max-height:100dvh;max-width:100vw;background:#050505;overflow:hidden}
.art{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill;user-select:none;-webkit-user-drag:none}
.hotspot{position:absolute;display:block;border:0;padding:0;margin:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:2}
.hotspot:focus-visible{outline:2px solid #fff2b3;outline-offset:2px;border-radius:12px}
.my{left:8.8%;top:68.1%;width:35.3%;height:6.5%}
.sg{left:54.5%;top:68.1%;width:36%;height:6.5%}
.play{left:47.3%;top:85.0%;width:8.5%;height:6.3%;border-radius:50%}
.volume{left:67.2%;top:87.8%;width:17.2%;height:2.7%;opacity:.01;cursor:pointer}
.status{position:absolute;left:50%;top:94%;transform:translateX(-50%);color:#f8d77d;font:12px Arial,sans-serif;text-shadow:0 1px 4px #000;opacity:0;pointer-events:none;white-space:nowrap;z-index:3}
.status.show{opacity:1}
@media (max-height:520px){.poster{width:auto;height:100dvh;max-width:100vw}}
</style>
</head>
<body>
<main class="poster" aria-label="TPOWER region selection">
<img class="art" src="region-background.png" alt="Select your region：Malaysia 与 Singapore 登录地区选择界面">
<a class="hotspot my" href="https://tinyurl.com/tpowernew" aria-label="Malaysia Login"></a>
<a class="hotspot sg" href="https://tinyurl.com/tpowersg" aria-label="Singapore Login"></a>
<button class="hotspot play" id="play" type="button" aria-label="播放或暂停音乐"></button>
<input class="hotspot volume" id="volume" type="range" min="0" max="1" step="0.01" value="0.75" aria-label="调整音乐音量">
<div class="status" id="status" role="status">点击音乐按钮播放</div>
<audio id="audio" src="TPOWER.mp3" preload="auto" loop playsinline></audio>
</main>
<script>
const audio=document.getElementById('audio');
const play=document.getElementById('play');
const volume=document.getElementById('volume');
const status=document.getElementById('status');
audio.volume=Number(volume.value);
function sync(){play.setAttribute('aria-label',audio.paused?'播放音乐':'暂停音乐')}
play.addEventListener('click',async()=>{
 if(audio.paused){try{await audio.play();status.classList.remove('show')}catch(e){status.textContent='请再点击一次播放音乐';status.classList.add('show')}}
 else{audio.pause()}
 sync();
});
volume.addEventListener('input',()=>{audio.volume=Number(volume.value)});
audio.addEventListener('play',sync);audio.addEventListener('pause',sync);
window.addEventListener('load',async()=>{try{await audio.play();status.classList.remove('show')}catch(e){status.classList.add('show')}sync()});
</script>
</body>
</html>
